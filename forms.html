<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="https://www.google.com/search">
        <input type="Text" placeholder="search google" id="google" name="q">
        <button type="submit">Submit</button>
    </form>
<hr>
    <form action="https://www.youtube.com/watch">
        <input type="Text" placeholder="search youtube" id="yt" name="v">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
